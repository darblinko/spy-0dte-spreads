[project]
name = "premium-selling"
version = "0.1.0"
description = "Same-day SPY option spread system on AWS Lambda, Step Functions and CDK"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Mitchell Foutz" }]
requires-python = "==3.12.*"
dependencies = [
    "alpaca-py>=0.43.0",
    "boto3>=1.28.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "tzdata>=2024.1",
    "yfinance>=1.2.0",
]

[dependency-groups]
cdk = [
    "aws-cdk-lib>=2.100.0",
    "constructs>=10.0.0",
]
dev = [
    "moto[dynamodb]>=5.0",
    "numpy>=2.5.3",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src", "cdk"]
testpaths = ["tests/unit"]

[tool.ruff]
line-length = 100
target-version = "py312"

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lint
        run: |
          uvx ruff check .
          uvx ruff format --check .
      - name: Unit tests
        run: uv run --group dev python -m pytest tests/unit -q
      - name: CDK synthesis tests
        run: uv run --group cdk --group dev python -m pytest tests/cdk -q
